[package]
name = "flipchart"
version = "0.2.3"
edition = "2024"

[lints.rust]
unused = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
missing_debug_implementations = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"

[dependencies]
base64 = "0.22"
eframe = "0.36.1"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
resvg = "0.45"
rmcp = { version = "3.2", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt", "io-std", "signal"] }
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }

[profile.dev]
opt-level = 1

[dev-dependencies]
serde_json = "1.0.151"
